<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>そらいろ御翔帳</title>
<meta name="description" content="JAL修行をたのしく続けるための、日本の空港スタンプラリー帳">
<meta name="theme-color" content="#9fd6f3">
<meta name="color-scheme" content="light">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="御翔帳">
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --sky:#bfe3f7; --sky-d:#7cc3ea; --sky-dd:#3d8fc4; --sky-l:#eaf6fd;
  --sakura:#f9d3dc; --sakura-l:#fdeef2; --cream:#fff8e7; --paper:#fffaf0;
  --red:#d7263d; --red-d:#b51d31; --ink:#3b3a4a; --muted:#6f6d84; --line:#ece4d4;
  --card:#fffdf8; --shadow:0 8px 24px rgba(70,100,150,.12),0 2px 6px rgba(70,100,150,.06);
  --r:24px;
  --font:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","ヒラギノ丸ゴ ProN","Hiragino Maru Gothic Pro","Kosugi Maru","Arial Rounded MT Bold",system-ui,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{font-family:var(--font);color:var(--ink);font-size:16px;line-height:1.6;background:var(--cream);
  background-image:radial-gradient(circle at 20% 10%,rgba(191,227,247,.55) 0 120px,transparent 260px),radial-gradient(circle at 90% 40%,rgba(249,211,220,.5) 0 100px,transparent 240px);
  overflow:hidden;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
#app{height:100vh;height:100dvh;display:flex;flex-direction:column;max-width:640px;margin:0 auto;position:relative}
/* header */
.hdr{flex:none;padding:calc(env(safe-area-inset-top) + 8px) 16px 10px;background:linear-gradient(180deg,#8ccdf0 0%,#bfe3f7 100%);
  display:flex;align-items:center;gap:10px;border-radius:0 0 26px 26px;box-shadow:0 6px 18px rgba(61,143,196,.18);position:relative;z-index:5}
.hdr .logo{width:44px;height:44px;flex:none}
.hdr h1{font-size:20px;margin:0;font-weight:800;letter-spacing:.06em;color:#21476a;line-height:1.2}
.hdr h1 small{display:block;font-size:14px;font-weight:700;color:#3d6d93;letter-spacing:.02em}
.hdr .sp{flex:1}
.iconbtn{width:44px;height:44px;border-radius:50%;border:0;background:rgba(255,255,255,.75);display:grid;place-items:center;box-shadow:0 2px 6px rgba(0,0,0,.08)}
.iconbtn svg{width:24px;height:24px}
/* main */
main{flex:1;overflow-y:auto;overflow-x:hidden;padding:16px 16px 24px;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
main.full{padding:0;overflow:hidden}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:16px;margin-bottom:16px;position:relative}
h2{font-size:18px;margin:0 0 10px;font-weight:800;display:flex;align-items:center;gap:8px}
h3{font-size:16px;margin:18px 0 8px;font-weight:800}
.muted{color:var(--muted)}
.small{font-size:14px}
/* tabs */
.tabs{flex:none;display:flex;background:rgba(255,253,248,.96);border-top:1px solid var(--line);padding:6px 4px calc(env(safe-area-inset-bottom) + 6px);gap:2px;z-index:5;
  box-shadow:0 -6px 18px rgba(70,100,150,.08);border-radius:22px 22px 0 0}
.tab{flex:1;min-height:56px;border:0;background:none;border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:14px;font-weight:700;color:var(--muted)}
.tab svg{width:26px;height:26px}
.tab[aria-current="page"]{color:var(--red);background:var(--sakura-l)}
/* buttons */
.btn{min-height:48px;padding:10px 20px;border-radius:999px;border:0;font-weight:800;font-size:16px;background:var(--sky-l);color:#23557d;display:inline-flex;align-items:center;justify-content:center;gap:8px;box-shadow:0 3px 0 rgba(61,143,196,.25)}
.btn:active{transform:translateY(2px);box-shadow:none}
.btn.primary{background:var(--red);color:#fff;box-shadow:0 4px 0 var(--red-d)}
.btn.big{width:100%;min-height:58px;font-size:20px;letter-spacing:.08em}
.btn.ghost{background:#fff;border:2px solid var(--line);box-shadow:none;color:var(--ink)}
.btn.sm{min-height:44px;padding:8px 14px;font-size:15px}
.btn.danger{background:#fff;color:var(--red);border:2px solid #f3c2ca;box-shadow:none}
.row{display:flex;gap:10px;align-items:center}
.wrap{flex-wrap:wrap}
/* segmented */
.seg{display:flex;background:var(--sky-l);border-radius:999px;padding:4px;gap:4px;margin-bottom:14px}
.seg button{flex:1;min-height:44px;border:0;border-radius:999px;background:none;font-weight:800;font-size:15px;color:#4a6f8e}
.seg button[aria-pressed="true"]{background:#fff;color:var(--red);box-shadow:0 2px 8px rgba(61,143,196,.2)}
/* hero ring */
.hero{display:flex;align-items:center;gap:14px}
.ring{width:150px;height:150px;flex:none}
.ring text{font-family:var(--font)}
.hero-stats{flex:1;display:grid;gap:8px}
.stat{background:var(--sky-l);border-radius:16px;padding:6px 12px;display:flex;justify-content:space-between;align-items:baseline;font-size:14px;font-weight:700}
.stat b{font-size:20px;color:#23557d}
.stat:nth-child(2){background:var(--sakura-l)}.stat:nth-child(2) b{color:var(--red)}
.stat:nth-child(3){background:#fff3d6}.stat:nth-child(3) b{color:#a0671a}
/* region bars */
.rbar{display:grid;grid-template-columns:28px 92px 1fr 54px;align-items:center;gap:8px;min-height:36px;font-size:15px;font-weight:700}
.rbar .em{font-size:20px;text-align:center}
.bar{height:12px;background:#f1ece2;border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--sky-d),var(--red));transition:width .6s}
.rbar .n{text-align:right;color:var(--muted);font-size:14px}
/* recent */
.hscroll{display:flex;gap:12px;overflow-x:auto;padding:4px 2px 8px;scroll-snap-type:x mandatory}
.hscroll::-webkit-scrollbar{display:none}
.rc{flex:none;width:112px;border:0;background:none;padding:0;text-align:center;scroll-snap-align:start}
.rc .stamp{width:104px;height:104px}
.rc span{display:block;font-size:14px;font-weight:700;line-height:1.3}
.rc small{font-size:14px;color:var(--muted)}
.empty-note{text-align:center;padding:12px 8px;color:var(--muted)}
/* stamps */
.stamp{display:block;overflow:visible}
.stamp .i{fill:var(--ink)}
.stamp .o{fill:none;stroke:var(--ink);stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.stamp .ot{stroke-width:1.5}
.stamp .ow{stroke-width:4.4}
.stamp .p{fill:var(--paper)}
.stamp .ps{fill:none;stroke:var(--paper);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.stamp .ib{fill:var(--ink);stroke:var(--paper);stroke-width:1.6}
.stamp .po{fill:var(--paper);stroke:var(--ink);stroke-width:2.6;stroke-linejoin:round}
.stamp .po.ow{stroke-width:4}
.stamp text{fill:var(--ink);font-family:var(--font);font-weight:800}
.stamp .sd{font-size:9.5px;letter-spacing:.8px}
.stamp .sc{font-size:10px;letter-spacing:2.5px}
.stamp.ghost{--paper:transparent}
.stamp.empty .ec{fill:#9d9bb0;font-size:15px;letter-spacing:2px}
/* book */
.reg-h{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.reg-h .em{font-size:24px}
.reg-h b{font-size:18px}
.reg-h .n{margin-left:auto;font-weight:800;color:var(--muted);font-size:15px}
.reg-h + .bar{margin-bottom:14px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px 6px}
.cell{border:0;background:none;padding:4px 2px;display:flex;flex-direction:column;align-items:center;gap:2px;position:relative;min-height:44px;border-radius:18px}
.cell:active{background:var(--sky-l)}
.cell .stamp{width:100%;max-width:104px;aspect-ratio:1/1;height:auto}
.cell .nm{font-size:14px;font-weight:700;line-height:1.25;text-align:center}
.cell .cnt{position:absolute;top:0;right:4px;background:var(--red);color:#fff;font-size:14px;font-weight:800;border-radius:99px;padding:0 8px;line-height:24px;box-shadow:0 2px 4px rgba(0,0,0,.15)}
.cell .unc{position:absolute;top:0;left:4px;background:#ffe9a8;color:#8a5a00;font-size:14px;font-weight:800;border-radius:99px;width:24px;height:24px;display:grid;place-items:center}
.cell .jt{font-size:14px;line-height:1.2;color:var(--red);font-weight:800}
.cell.pop .stamp{animation:pop .6s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{0%{transform:scale(.4)}100%{transform:scale(1)}}
/* chips */
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.chip{display:inline-flex;align-items:center;min-height:32px;padding:2px 12px;border-radius:99px;background:#f2eee6;font-size:14px;font-weight:700}
.chip.red{background:var(--sakura-l);color:var(--red)}
.chip.sky{background:var(--sky-l);color:#23557d}
.chip.cream{background:#fff3d6;color:#8a5a00}
.chip.warn{background:#ffe9a8;color:#7a4f00}
.chips-scroll{display:flex;gap:8px;overflow-x:auto;padding:12px 16px 8px}
.chips-scroll::-webkit-scrollbar{display:none}
.chipbtn{flex:none;min-height:44px;padding:6px 16px;border-radius:99px;border:2px solid var(--line);background:#fff;font-weight:800;font-size:15px}
.chipbtn[aria-pressed="true"]{background:var(--red);border-color:var(--red);color:#fff}
/* sheet */
#sheet{position:fixed;inset:0;z-index:50;display:none}
#sheet.open{display:block}
.sheet-backdrop{position:absolute;inset:0;background:rgba(40,50,70,.35);opacity:0;transition:opacity .25s}
#sheet.show .sheet-backdrop{opacity:1}
.sheet-panel{position:absolute;left:0;right:0;bottom:0;margin:0 auto;max-width:640px;max-height:92vh;max-height:92dvh;background:var(--card);border-radius:28px 28px 0 0;
  transform:translateY(102%);transition:transform .3s cubic-bezier(.2,.9,.3,1);display:flex;flex-direction:column;box-shadow:0 -10px 30px rgba(0,0,0,.15)}
#sheet.show .sheet-panel{transform:none}
.sheet-grip{width:48px;height:5px;border-radius:9px;background:#ddd5c5;margin:10px auto 0;flex:none}
.sheet-close{position:absolute;top:8px;right:10px;width:44px;height:44px;border-radius:50%;border:0;background:#f2eee6;font-size:24px;line-height:1;z-index:2}
.sheet-body{overflow-y:auto;padding:8px 18px calc(env(safe-area-inset-bottom) + 24px);-webkit-overflow-scrolling:touch}
.detail-top{text-align:center;padding-top:6px}
.big-stamp{width:200px;height:200px;margin:4px auto 6px}
.big-stamp .stamp{width:100%;height:100%}
.detail-top h2{justify-content:center;font-size:22px;margin:4px 0 0}
.meta{margin:0;color:var(--muted);font-size:15px;font-weight:700}
.warnbox{background:#fff6d8;border:2px dashed #f0cf6b;border-radius:18px;padding:12px;margin:12px 0;font-size:15px}
.warnbox b{color:#7a4f00}
.hist{list-style:none;padding:0;margin:0;display:grid;gap:10px}
.hist li{background:#fff;border:2px solid var(--line);border-radius:18px;padding:10px 12px}
.hist .hd{display:flex;align-items:center;gap:8px;font-weight:800}
.hist .hd .d{font-size:16px}
.hist .hd .sp{flex:1}
.hist .ln{font-size:15px}
.hist .ln span{color:var(--muted);font-weight:700;margin-right:6px}
.mini{width:44px;height:44px;border-radius:50%;border:0;background:#f2eee6;display:grid;place-items:center}
.mini svg{width:20px;height:20px}
details.fix{margin-top:16px;border:2px solid var(--line);border-radius:18px;padding:4px 12px}
details.fix summary{min-height:44px;display:flex;align-items:center;font-weight:800;cursor:pointer}
.toggle{display:flex;align-items:center;justify-content:space-between;min-height:52px;gap:10px;font-weight:700;border-bottom:1px solid var(--line)}
.toggle:last-child{border-bottom:0}
.sw{appearance:none;-webkit-appearance:none;width:56px;height:34px;border-radius:99px;background:#ddd5c5;position:relative;flex:none;transition:background .2s;margin:0}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:28px;height:28px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.2);transition:transform .2s}
.sw:checked{background:var(--red)}
.sw:checked::after{transform:translateX(22px)}
/* form */
.form{display:grid;gap:12px}
.form label{display:grid;gap:4px;font-weight:800;font-size:15px}
.form input:not([type=checkbox]),.form select,.form textarea{width:100%;min-height:48px;border-radius:14px;border:2px solid var(--line);background:#fff;padding:10px 12px;font-size:16px;font-weight:500}
.form input:focus,.form select:focus,.form textarea:focus{outline:none;border-color:var(--sky-d);box-shadow:0 0 0 4px rgba(124,195,234,.25)}
.route{display:grid;grid-template-columns:1fr 24px 1fr;align-items:end;gap:6px}
.route .arr{text-align:center;padding-bottom:12px;font-weight:800;color:var(--muted)}
.qchips{display:flex;flex-wrap:wrap;gap:6px}
.qchips button{min-height:40px;padding:4px 14px;border-radius:99px;border:2px solid var(--line);background:#fff;font-size:14px;font-weight:700}
.check{display:flex!important;grid-template-columns:none;align-items:center;gap:10px;min-height:48px}
.check input{width:26px;height:26px;accent-color:var(--red)}
.press-preview{width:120px;height:120px;margin:0 auto}
/* press overlay */
.press-ov{position:fixed;inset:0;z-index:80;background:rgba(255,248,231,.94);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center;animation:fade .2s}
@keyframes fade{from{opacity:0}}
.press-stage{width:min(72vw,300px);height:min(72vw,300px);position:relative}
.press-stamp{width:100%;height:100%;animation:press .62s cubic-bezier(.3,.7,.3,1) both;transform-origin:50% 50%}
.press-stamp .stamp{width:100%;height:100%}
@keyframes press{0%{transform:translateY(-30px) scale(2.3) rotate(calc(var(--t) - 28deg));opacity:0}
  55%{transform:scale(.88) rotate(var(--t));opacity:1}72%{transform:scale(1.05) rotate(var(--t))}100%{transform:scale(1) rotate(var(--t))}}
.press-stage::after{content:"";position:absolute;inset:-8%;border-radius:50%;border:6px solid var(--red);opacity:0;animation:ripple .7s .34s ease-out}
@keyframes ripple{0%{opacity:.5;transform:scale(.8)}100%{opacity:0;transform:scale(1.35)}}
.pon{font-size:44px;font-weight:800;color:var(--red);letter-spacing:.1em;margin-top:8px;animation:ponin .5s .34s cubic-bezier(.2,1.8,.4,1) both;text-shadow:0 3px 0 #fff}
@keyframes ponin{from{transform:scale(0) rotate(-12deg);opacity:0}}
.press-name{font-size:22px;font-weight:800;margin:4px 0 0}
.press-sub{margin:2px 0 16px;color:var(--muted);font-weight:700}
.press-ov .btn{min-width:220px}
.press-ov.shake .press-stage{animation:shake .25s .34s}
@keyframes shake{25%{transform:translate(3px,2px)}50%{transform:translate(-3px,-1px)}75%{transform:translate(2px,-2px)}}
.newbadge{background:#fff;border-radius:20px;padding:10px 16px;margin:0 0 14px;box-shadow:var(--shadow);font-weight:800;animation:ponin .5s .9s both}
.newbadge .e{font-size:30px;display:block}
.confetti{position:fixed;inset:0;width:100vw;height:100vh;pointer-events:none;z-index:90}
/* map */
.mapwrap{height:100%;display:flex;flex-direction:column}
.mapbox{flex:1;position:relative;margin:0 12px 12px;border-radius:24px;overflow:hidden;background:#d7eefb;box-shadow:var(--shadow)}
#map{width:100%;height:100%;display:block;touch-action:none;user-select:none;-webkit-user-select:none}
#map .land{fill:#fffaf0;stroke:#e3cfae;stroke-width:1.2;stroke-linejoin:round}
#map .inset{fill:rgba(255,255,255,.35);stroke:#9cc9e6;stroke-width:1.5;stroke-dasharray:6 5}
#map .inset-t{fill:#4a7aa0;font-family:var(--font);font-weight:800}
#map .lbl{font-family:var(--font);font-weight:800;fill:#3b3a4a;paint-order:stroke;stroke:#fff;stroke-width:3px;pointer-events:none}
.mapctrl{position:absolute;right:10px;top:10px;display:grid;gap:8px}
.mapctrl button{width:48px;height:48px;border-radius:16px;border:0;background:rgba(255,255,255,.92);font-size:24px;font-weight:800;box-shadow:0 2px 8px rgba(0,0,0,.12)}
.legend{position:absolute;left:10px;bottom:10px;background:rgba(255,255,255,.9);border-radius:14px;padding:6px 10px;font-size:14px;font-weight:700;display:grid;gap:2px}
.legend i{display:inline-block;width:14px;height:14px;border-radius:50%;vertical-align:-2px;margin-right:6px}
.mapcard{position:absolute;left:10px;right:10px;bottom:10px;background:var(--card);border-radius:22px;box-shadow:0 8px 28px rgba(0,0,0,.18);padding:12px;display:flex;gap:12px;align-items:center;animation:up .25s}
@keyframes up{from{transform:translateY(20px);opacity:0}}
.mapcard .stamp{width:76px;height:76px;flex:none}
.mapcard .tx{flex:1;min-width:0}
.mapcard b{font-size:17px;display:block;line-height:1.3}
.mapcard .btns{display:flex;flex-direction:column;gap:6px}
/* dashboard */
.dash-ring{display:flex;align-items:center;gap:14px}
.dash-ring svg{width:140px;height:140px;flex:none}
.big-n{font-size:30px;font-weight:800;color:var(--red);line-height:1.1}
.lsp-edit{display:grid;grid-template-columns:56px 1fr 56px;gap:8px;margin-top:12px}
.lsp-edit input{text-align:center;font-size:24px!important;font-weight:800!important}
.lsp-edit button{min-height:52px;border-radius:16px;border:0;background:var(--sky-l);font-size:18px;font-weight:800;color:#23557d}
.ms{position:relative;height:16px;background:#f1ece2;border-radius:99px;margin:22px 0 28px}
.ms i{position:absolute;left:0;top:0;bottom:0;border-radius:99px;background:linear-gradient(90deg,#ffd86b,var(--red))}
.ms span{position:absolute;top:-22px;transform:translateX(-50%);font-size:14px;font-weight:800;color:var(--muted);white-space:nowrap}
.ms em{position:absolute;top:20px;transform:translateX(-50%);font-size:14px;font-style:normal;font-weight:700;color:var(--muted);white-space:nowrap}
.ms span::after{content:"";position:absolute;left:50%;top:22px;width:2px;height:16px;background:#fff}
.tri{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.tri div{background:var(--sky-l);border-radius:18px;padding:10px 4px}
.tri b{display:block;font-size:26px;line-height:1.2;color:#23557d}
.tri span{font-size:14px;font-weight:700}
.adj{display:flex;justify-content:center;gap:6px;margin-top:6px}
.adj button{width:44px;height:44px;border-radius:50%;border:0;background:#fff;font-weight:800;font-size:18px;box-shadow:0 1px 4px rgba(0,0,0,.1)}
.months{display:grid;grid-template-columns:repeat(12,1fr);gap:4px;align-items:end;height:120px;margin-top:8px}
.months div{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:2px}
.months i{display:block;width:100%;border-radius:6px 6px 2px 2px;background:linear-gradient(180deg,var(--red),#f7a1b5);min-height:3px}
.months b{font-size:14px;line-height:1}
.mlab{display:grid;grid-template-columns:repeat(12,1fr);gap:4px;text-align:center;font-size:14px;color:var(--muted);font-weight:700;margin-top:4px}
.tips{margin:0;padding-left:20px;font-size:15px}
.tips li{margin-bottom:6px}
.conf{display:inline-block;font-size:14px;font-weight:800;border-radius:8px;padding:0 6px;background:#f2eee6;color:var(--muted)}
/* badges */
.bgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.bdg{background:#fff;border:2px solid var(--line);border-radius:20px;padding:12px 10px;text-align:center;position:relative}
.bdg .e{font-size:38px;line-height:1.2;display:block;filter:grayscale(1);opacity:.35}
.bdg b{display:block;font-size:15px;line-height:1.35}
.bdg p{margin:2px 0 6px;font-size:14px;color:var(--muted);line-height:1.4}
.bdg .bar{height:8px}
.bdg .pg{font-size:14px;font-weight:800;color:var(--muted)}
.bdg.on{border-color:#f7c0cb;background:linear-gradient(180deg,#fff,var(--sakura-l))}
.bdg.on .e{filter:none;opacity:1;animation:wob 3s ease-in-out infinite}

/* ---------- 保存 ---------- */
const LS_KEY='sorairo-goshocho-v1';
const defaultState=()=>({version:1,visits:[],lsp:0,flightAdjust:0,settings:{course:'jal',sound:true},overrides:{},seenBadges:null});
function load(){
  try{
    const raw=localStorage.getItem(LS_KEY);
    if(raw){const d=JSON.parse(raw);return normalize(d)}
  }catch(e){console.warn('load failed',e)}
  return defaultState();
}
function normalize(d){
  const s=Object.assign(defaultState(),d||{});
  s.settings=Object.assign(defaultState().settings,(d&&d.settings)||{});
  s.visits=Array.isArray(s.visits)?s.visits.filter(v=>v&&v.code&&v.date).map(v=>({id:v.id||uid(),code:String(v.code),date:String(v.date).slice(0,10),flight:v.flight||'',from:v.from||'',to:v.to||'',memo:v.memo||'',companions:v.companions||'',boarded:v.boarded!==false,tilt:typeof v.tilt==='number'?v.tilt:randTilt(),createdAt:v.createdAt||Date.now()})):[];
  s.overrides=(s.overrides&&typeof s.overrides==='object')?s.overrides:{};
  s.lsp=Math.max(0,+s.lsp||0); s.flightAdjust=+s.flightAdjust||0;
  return s;
}
let storageOK=true;
function save(){
  try{localStorage.setItem(LS_KEY,JSON.stringify(S));storageOK=true;return true}
  catch(e){if(storageOK)toast('端末に保存できませんでした。JSON書き出しでバックアップしてね');storageOK=false;return false}
}

/* ---------- utils ---------- */
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const todayStr=()=>{const d=new Date();return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`};
const dotDate=s=>s?String(s).replace(/-/g,'.'):'';
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function randTilt(){return Math.round((Math.random()*2-1)*13)}
let SVGID=0;
let S=load();

function airports(){return BASE.map(a=>{const o=S.overrides[a.code]||{};return Object.assign({},a,{jal:o.jal!=null?o.jal:a.jal,island:o.island!=null?o.island:a.island,uncertain:a.uncertain&&!o.confirmed,edited:o.jal!=null||o.island!=null,full:a.name+(a.name.endsWith('飛行場')?'':'空港')})})}
function apByCode(code){return airports().find(a=>a.code===code)}
function courseList(A=airports()){return S.settings.course==='jal'?A.filter(a=>a.jal):A}
function visitsOf(code){return S.visits.filter(v=>v.code===code).sort(sortVisits)}
function sortVisits(a,b){return a.date<b.date?1:a.date>b.date?-1:(b.createdAt||0)-(a.createdAt||0)}

/* ---------- 集計 ---------- */
function ctx(){
  const A=airports(); const byCode=Object.fromEntries(A.map(a=>[a.code,a]));
  const vs=S.visits.filter(v=>byCode[v.code]);
  const uniq=new Set(vs.map(v=>v.code));
  const count={};vs.forEach(v=>count[v.code]=(count[v.code]||0)+1);
  const days={};vs.forEach(v=>{(days[v.date]=days[v.date]||new Set()).add(v.code)});
  const maxDay=Math.max(0,...Object.values(days).map(s=>s.size));
  const maxSame=Math.max(0,...Object.values(count));
  const boarded=vs.filter(v=>v.boarded).length;
  const flights=Math.max(0,boarded+(S.flightAdjust||0));
  const withComp=vs.filter(v=>(v.companions||'').trim()).length;
  const seasons=new Set(vs.map(v=>{const m=+String(v.date).slice(5,7);return m>=3&&m<=5?0:m>=6&&m<=8?1:m>=9&&m<=11?2:3})).size;
  const islands=A.filter(a=>a.island&&uniq.has(a.code)).length;
  const jal=A.filter(a=>a.jal);
  const reg={};REGIONS.forEach(r=>{const all=A.filter(a=>a.region===r.id),j=all.filter(a=>a.jal);
    reg[r.id]={all:all.length,allDone:all.filter(a=>uniq.has(a.code)).length,jal:j.length,jalDone:j.filter(a=>uniq.has(a.code)).length}});
  const has=c=>uniq.has(c)?1:0;
  return {A,byCode,vs,uniq,count,maxDay,maxSame,boarded,flights,withComp,seasons,islands,reg,has,
    jalTotal:jal.length,jalDone:jal.filter(a=>uniq.has(a.code)).length,allTotal:A.length,allDone:uniq.size,lsp:+S.lsp||0};
}

function badgeStates(c=ctx()){return BADGES.map(b=>{const [cur,goal]=b.f(c);return Object.assign({},b,{cur,goal,on:goal>0&&cur>=goal})})}
function syncBadges(silent){
  const on=badgeStates().filter(b=>b.on);
  if(!Array.isArray(S.seenBadges)){S.seenBadges=on.map(b=>b.id);save();return []}
  const fresh=on.filter(b=>!S.seenBadges.includes(b.id));
  if(fresh.length){S.seenBadges.push(...fresh.map(b=>b.id));save()}
  return silent?[]:fresh;
}

/* ---------- スタンプ描画 ---------- */
function stampSVG(a,v,cls=''){
  const id='s'+(++SVGID); const ink=REG[a.region].ink; const tilt=v&&typeof v.tilt==='number'?v.tilt:0;
  const name=a.full; const fs=Math.min(10.5,118/Math.max(1,name.length)).toFixed(1);
  return `<svg class="stamp ${cls}" viewBox="-60 -60 120 120" style="--ink:${ink};transform:rotate(${tilt}deg)" role="img" aria-label="${esc(name)}のスタンプ">
<defs><path id="${id}t" d="M-44 0A44 44 0 0 1 44 0"/><path id="${id}b" d="M-51.5 0A51.5 51.5 0 0 0 51.5 0"/></defs>
<g filter="url(#rough)"><circle r="56.5" class="p"/><circle r="54.5" class="o" style="stroke-width:3.4"/><circle r="41" class="o" style="stroke-width:1.3"/>
<text style="font-size:${fs}px;letter-spacing:1px"><textPath href="#${id}t" startOffset="50%" text-anchor="middle">${esc(name)}</textPath></text>
<text class="sd"><textPath href="#${id}b" startOffset="50%" text-anchor="middle">${v?dotDate(v.date):'★'}</textPath></text>
<path class="i" d="${star(-47.5,0,3.2)}"/><path class="i" d="${star(47.5,0,3.2)}"/>
<g transform="translate(0 -5)">${MOTIF[a.motif]||''}</g>
<text class="sc" y="34" text-anchor="middle">${esc(a.code)}</text></g></svg>`;
}
function emptySVG(a,cls=''){
  return `<svg class="stamp empty ${cls}" viewBox="-60 -60 120 120" role="img" aria-label="${esc(a.full)}（未訪問）">
<circle r="52" fill="rgba(255,255,255,.55)" stroke="#b8b6c8" stroke-width="2.5" stroke-dasharray="6 6"/>
<g class="ghost" style="--ink:#8f8da3;--paper:transparent;opacity:.18" transform="translate(0 -6) scale(.9)">${MOTIF[a.motif]||''}</g>
<text class="ec" y="38" text-anchor="middle">${esc(a.code)}</text></svg>`;
}

<g transform="translate(${px.toFixed(1)} ${py.toFixed(1)}) rotate(${ang+90}) scale(.8)"><circle r="12" fill="#fff" stroke="#f1ece2" stroke-width="2"/><path d="${PL}" fill="#d7263d" transform="scale(.75)"/></g>

/* ---------- 押印演出 ---------- */
let AC=null;
function unlockAudio(){if(!S.settings.sound)return;try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume()}catch(e){}}
function pon(delay=0){
  if(!S.settings.sound||!AC)return;

  if(MV.ptr.size===1){const p=MV.ptr.get(e.pointerId),p0=g.pts.get(e.pointerId);if(!p0)return;const dx=p.x-p0.x,dy=p.y-p0.y;MV.moved=Math.max(MV.moved,Math.hypot(dx,dy));
    MV.vb={x:g.vb.x-dx*g.vb.w/w,y:g.vb.y-dy*g.vb.h/h,w:g.vb.w,h:g.vb.h};applyVB()}
  else if(MV.ptr.size>=2){const ids=[...MV.ptr.keys()].slice(0,2);const a=MV.ptr.get(ids[0]),b=MV.ptr.get(ids[1]),a0=g.pts.get(ids[0]),b0=g.pts.get(ids[1]);if(!a0||!b0)return;MV.moved=99;
    const d0=Math.hypot(a0.x-b0.x,a0.y-b0.y)||1,d=Math.hypot(a.x-b.x,a.y-b.y)||1;const m0={x:(a0.x+b0.x)/2-r.left,y:(a0.y+b0.y)/2-r.top},m={x:(a.x+b.x)/2-r.left,y:(a.y+b.y)/2-r.top};
    const wx=g.vb.x+m0.x/w*g.vb.w,wy=g.vb.y+m0.y/h*g.vb.h;const nw=Math.min(1100,Math.max(70,g.vb.w*d0/d)),nh=nw*g.vb.h/g.vb.w;
    MV.vb={x:wx-m.x/w*nw,y:wy-m.y/h*nh,w:nw,h:nh};applyVB()}
}
function mapUp(e){
  const wasSingle=MV.ptr.size===1;MV.ptr.delete(e.pointerId);
  MV.g0={vb:Object.assign({},MV.vb),pts:new Map([...MV.ptr].map(([k,p])=>[k,Object.assign({},p)]))};
  if(wasSingle&&MV.moved<8&&e.type==='pointerup'){
    const [sx,sy]=clientToSvg(e.clientX,e.clientY);const {w}=mapAspect();const s=MV.vb.w/w;
    let best=null,bd=1e9;ctx().A.forEach(a=>{const [x,y]=proj(a.lon,a.lat);const d=Math.hypot(x-sx,y-sy);if(d<bd){bd=d;best=a}});
    if(best&&bd/s<30)selectOnMap(best.code);else selectOnMap(null);
  }
}
function selectOnMap(code){
  MV.sel=code;applyVB();const card=$('#mapcard'),leg=$('#legend');
  if(!code){card.classList.add('hidden');leg.classList.remove('hidden');return}
  const a=apByCode(code),vs=visitsOf(code);leg.classList.add('hidden');
  card.classList.remove('hidden');
  card.innerHTML=`${vs.length?stampSVG(a,vs[0]):emptySVG(a)}<div class="tx"><b>${esc(a.full)}</b><div class="small muted">${esc(a.pref)}・${a.jal?'JAL就航':'JAL就航なし'}</div><div class="small">${vs.length?`スタンプ ${vs.length}回`:'まだ押していません'}</div></div>
  <div class="btns"><button class="btn sm primary" data-act="stampform" data-code="${a.code}">押す</button><button class="btn sm" data-act="airport" data-code="${a.code}">詳しく</button></div>`;
}
function mapRegion(rid){
  document.querySelectorAll('[data-act="mreg"]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.r===rid));
  if(rid==='all'){fitMap(0,0,MAPW,MAPH);return}
  const pts=airports().filter(a=>a.region===rid).map(a=>proj(a.lon,a.lat));
  let x0=Math.min(...pts.map(p=>p[0])),x1=Math.max(...pts.map(p=>p[0])),y0=Math.min(...pts.map(p=>p[1])),y1=Math.max(...pts.map(p=>p[1]));
  const pad=36;x0-=pad;x1+=pad;y0-=pad;y1+=pad;if(x1-x0<140){const c=(x0+x1)/2;x0=c-70;x1=c+70}if(y1-y0<140){const c=(y0+y1)/2;y0=c-70;y1=c+70}
  fitMap(x0,y0,x1,y1);
}

/* ---------- 設定 ---------- */
function openSettings(){
  const unc=airports().filter(a=>BASE.find(b=>b.code===a.code).uncertain);
  openSheet(`
  <h2 style="margin-top:6px">⚙️ 設定とデータ</h2>
  <div class="card" style="box-shadow:none;border:2px solid var(--line)">
    <label class="toggle">押印の効果音<input type="checkbox" class="sw" data-act="sound" ${S.settings.sound?'checked':''}></label>
  </div>
  <h3>💾 バックアップ</h3>
  <p class="small muted" style="margin-top:0">記録はこの端末（ブラウザ）の中だけに保存されます。機種変更や念のために、ときどき書き出しておくと安心です。</p>
  <div class="row wrap"><button class="btn primary" data-act="export">JSONで書き出す</button><button class="btn" data-act="import">JSONを読み込む</button></div>
  <h3>🛠 要確認の空港（${unc.filter(a=>a.uncertain).length}/${unc.length}）</h3>
  <p class="small muted" style="margin-top:0">自信のないデータです。タップして直したり「確認済み」にできます。</p>
  <div>${unc.map(a=>`<div class="list-row"><div class="tx"><b>${a.uncertain?'⚠️':'✅'} ${esc(a.code)} ${esc(a.full)}</b><span>${esc(a.note)}</span></div><button class="btn sm" data-act="airport" data-code="${a.code}">直す</button></div>`).join('')}</div>
  <h3>ℹ️ このアプリについて</h3>
  <p class="small">収録：${BASE.length}空港（JALグループ就航 ${airports().filter(a=>a.jal).length}）。スタンプの図案はすべてオリジナルです。航空会社のロゴ・商標は使用していません。就航情報は変わることがあるので、最新情報は各社公式でご確認ください。</p>
  <h3 style="color:var(--red)">危険ゾーン</h3>
  <button class="btn danger" data-act="reset">すべての記録を消す</button>
  `);
}
function doExport(){
  const payload={app:'sorairo-goshocho',version:1,exportedAt:new Date().toISOString(),data:S};
  const json=JSON.stringify(payload,null,2);const name=`sorairo-goshocho-${todayStr().replace(/-/g,'')}.json`;
  try{
    const file=new File([json],name,{type:'application/json'});
    if(navigator.canShare&&navigator.canShare({files:[file]})){navigator.share({files:[file],title:'そらいろ御翔帳 バックアップ'}).catch(()=>{});return}
  }catch(e){}
  const url=URL.createObjectURL(new Blob([json],{type:'application/json'}));
  const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),4000);
  toast('書き出しました');
}
function doImport(file){
  const rd=new FileReader();
  rd.onload=()=>{try{
    const j=JSON.parse(rd.result);const d=j&&j.data?j.data:j;
    if(!d||!Array.isArray(d.visits))throw new Error('形式が違います');
    const n=normalize(d);
    const mode=S.visits.length?confirm(`記録 ${n.visits.length} 件を読み込みます。\n\nOK：今の記録に「追加」\nキャンセル：今の記録を「置き換え」`):true;
    if(mode&&S.visits.length){const ids=new Set(S.visits.map(v=>v.id));n.visits.forEach(v=>{if(!ids.has(v.id))S.visits.push(v)});S.lsp=Math.max(S.lsp,n.lsp);Object.assign(S.overrides,n.overrides)}
    else{S=n}
    S.seenBadges=null;save();syncBadges(true);closeSheet();rerender();toast('読み込みました');
  }catch(e){toast('読み込めませんでした：'+e.message)}};
  rd.readAsText(file);
}

/* ---------- ルーティング ---------- */
const RENDER={home:renderHome,map:renderMap,book:renderBook,dash:renderDash,badges:renderBadges};
function go(v){
  VIEW=v;view.classList.remove('full');
  document.querySelectorAll('.tab').forEach(t=>t.setAttribute('aria-current',t.dataset.v===v?'page':'false'));
  RENDER[v]();if(v!=='map')view.scrollTop=0;
  try{sessionStorage.setItem('sg-view',v)}catch(e){}
}
function rerender(popCode){
  const st=view.scrollTop;
  if(VIEW==='map'&&MV){const vb=Object.assign({},MV.vb),sel=MV.sel;renderMap();MV.vb=vb;applyVB();if(sel)selectOnMap(sel);return}
  RENDER[VIEW]();view.scrollTop=st;
  if(popCode){const el=view.querySelector(`.cell[data-code="${popCode}"]`);if(el){el.classList.add('pop')}}
}

/* ---------- イベント ---------- */
const ACT={
  tab:t=>{closeSheet();go(t.dataset.v)},
  course:t=>{S.settings.course=t.dataset.c;save();$('#hdrsub').textContent=S.settings.course==='jal'?'JAL修行スタンプラリー':'全国空港スタンプラリー';rerender()},
  airport:t=>openAirport(t.dataset.code),
  stampform:t=>openStampForm(t.dataset.code),
  editvisit:t=>{const v=S.visits.find(x=>x.id===t.dataset.id);if(v)openStampForm(v.code,v.id)},
  delvisit:t=>{const v=S.visits.find(x=>x.id===t.dataset.id);if(!v)return;if(!confirm(`${dotDate(v.date)} の記録を消しますか？`))return;S.visits=S.visits.filter(x=>x!==v);save();openAirport(v.code);rerender();toast('消しました')},
  qcomp:t=>{const inp=$('#vf [name=companions]');const cur=inp.value.trim();const q=t.dataset.q;if(!cur.split(/[、,，\s]+/).includes(q))inp.value=cur?cur+'、'+q:q},
  ov:t=>{const o=S.overrides[t.dataset.code]=S.overrides[t.dataset.code]||{};o[t.dataset.k]=t.checked;save();rerender();showNewBadges(syncBadges())},
  confirm:t=>{const o=S.overrides[t.dataset.code]=S.overrides[t.dataset.code]||{};o.confirmed=!o.confirmed;save();openAirport(t.dataset.code);rerender()},
  ovreset:t=>{const o=S.overrides[t.dataset.code]||{};delete o.jal;delete o.island;save();openAirport(t.dataset.code);rerender()},
  settings:()=>openSettings(),
  sound:t=>{S.settings.sound=t.checked;save();if(t.checked){unlockAudio();pon(0)}},
  export:()=>doExport(),
  import:()=>$('#importFile').click(),
  reset:()=>{if(!confirm('すべての記録・設定を消します。本当によろしいですか？'))return;if(!confirm('元に戻せません。書き出し（バックアップ）は済んでいますか？'))return;S=defaultState();save();syncBadges(true);closeSheet();rerender();toast('リセットしました')},
  lsp:t=>{S.lsp=Math.max(0,(+S.lsp||0)+(+t.dataset.d));save();renderDash();showNewBadges(syncBadges())},
  fadj:t=>{const c=ctx();if(+t.dataset.d<0&&c.flights<=0)return;S.flightAdjust=(S.flightAdjust||0)+(+t.dataset.d);save();renderDash();showNewBadges(syncBadges())},
  mreg:t=>mapRegion(t.dataset.r),
  zin:()=>{const {w,h}=mapAspect();zoomAt(1/1.5,w/2,h/2)},
  zout:()=>{const {w,h}=mapAspect();zoomAt(1.5,w/2,h/2)},
  zreset:()=>mapRegion('all'),
};
document.addEventListener('click',e=>{const t=e.target.closest('[data-act]');if(!t||t.matches('input'))return;const f=ACT[t.dataset.act];if(f){f(t,e)}});
document.addEventListener('change',e=>{const t=e.target;if(t.matches('input[data-act]')){const f=ACT[t.dataset.act];if(f)f(t,e)}});
$('#importFile').addEventListener('change',e=>{const f=e.target.files&&e.target.files[0];if(f)doImport(f);e.target.value=''});
window.addEventListener('resize',()=>{if(VIEW==='map'&&MV){const v=MV.vb;fitMap(v.x,v.y,v.x+v.w,v.y+v.h,false)}});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet()});

/* ---------- 起動 ---------- */
syncBadges(true);
$('#hdrsub').textContent=S.settings.course==='jal'?'JAL修行スタンプラリー':'全国空港スタンプラリー';
let startView='home';try{startView=sessionStorage.getItem('sg-view')||'home'}catch(e){}
go(RENDER[startView]?startView:'home');
if('serviceWorker' in navigator&&/^https?:/.test(location.protocol)){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(e=>console.warn('SW',e)))}
</script>
